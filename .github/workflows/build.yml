# Continuous integration: builds and tests beam-desktop on Linux, macOS and Windows,
# and builds beam-signaling (read-only: this workflow never modifies that module).
# Signaling's context test needs a TURN_SECRET value, so CI supplies a dummy —
# the real secret lives only in /etc/beam/beam-signaling.env on the VPS.
name: Build

on:
  push:
  pull_request:

jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: beam-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./mvnw -B verify
        if: runner.os != 'Windows'
      - run: ./mvnw.cmd -B verify
        if: runner.os == 'Windows'

  signaling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beam-signaling
    env:
      TURN_SECRET: ci-dummy-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./mvnw -B verify
