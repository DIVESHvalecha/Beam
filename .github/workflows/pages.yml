# Deploys the static beam-web folder to GitHub Pages. No build step: the page is
# plain HTML/JS/CSS by design, so the folder is uploaded as-is.
name: Deploy beam-web to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload beam-web
        uses: actions/upload-pages-artifact@v4
        with:
          path: beam-web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
