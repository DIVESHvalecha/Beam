# Release: on a version tag (v1.0.0, …) rebuild beam.jar from scratch and attach it
# to a GitHub Release. Uses the preinstalled `gh` CLI — no third-party actions.
name: Release beam.jar

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build beam.jar
        working-directory: beam-desktop
        run: ./mvnw -B clean -DskipTests package
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          test -f beam-desktop/target/beam.jar || { echo "beam.jar missing"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" beam-desktop/target/beam.jar --clobber
          else
            gh release create "$TAG" beam-desktop/target/beam.jar \
              --title "Beam $TAG" --generate-notes
          fi
